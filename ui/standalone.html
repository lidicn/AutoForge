<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoForge 控制台</title>
<style>
:root{--af-bg:#f5f5f5;--af-surface:#fff;--af-primary:#4f46e5;--af-primary-light:#818cf8;--af-error:#dc2626;--af-warning:#f59e0b;--af-success:#10b981;--af-info:#3b82f6;--af-text:#1f2937;--af-text-secondary:#6b7280;--af-border:#e5e7eb;--af-radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--af-bg);color:var(--af-text);line-height:1.6}
a{text-decoration:none;color:var(--af-primary)}
.page{max-width:960px;margin:0 auto;padding:24px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{font-size:0.9rem}
h1{font-size:1.4rem}
h2{font-size:0.9rem;margin-bottom:12px;color:var(--af-text-secondary);text-transform:uppercase;letter-spacing:0.05em}
.tagline{color:var(--af-text-secondary);margin-bottom:24px}
.panel{background:var(--af-surface);border-radius:var(--af-radius);padding:20px;margin-bottom:16px;border:1px solid var(--af-border)}
.code-block{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:6px;overflow-x:auto;font-size:0.85rem;line-height:1.5;white-space:pre-wrap}
.nl-text{background:#f0f9ff;border-left:4px solid var(--af-info);padding:12px 16px;border-radius:0 6px 6px 0;font-size:1rem;line-height:1.7}
.status-badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:600;font-size:0.9rem}
.status-badge.ok{background:#d1fae5;color:#065f46}
.status-badge.err{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--af-border)}
th{background:#f9fafb;font-weight:600;font-size:0.85rem;color:var(--af-text-secondary);text-transform:uppercase}
.band{display:inline-block;padding:2px 10px;border-radius:99px;font-size:0.8rem;font-weight:600}
.btn{color:var(--af-primary);cursor:pointer;border:none;background:none;font-size:0.9rem;padding:4px 0;border-bottom:1px dashed var(--af-primary)}
.btn:hover{text-decoration:underline}
.btn-primary{padding:10px 20px;background:var(--af-primary);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.btn-small{padding:4px 10px;background:var(--af-surface);border:1px solid var(--af-border);border-radius:4px;cursor:pointer;font-size:0.8rem}
.btn-small:hover{border-color:var(--af-primary);color:var(--af-primary)}
input,select,textarea{padding:8px 12px;border:1px solid var(--af-border);border-radius:6px;font-size:0.9rem;width:100%}
textarea.code-input{font-family:monospace;font-size:0.85rem;resize:vertical}
.search-input{margin-bottom:16px}
.error{color:var(--af-error);padding:12px;background:#fef2f2;border-radius:6px;margin-bottom:16px}
.diag-group{margin-bottom:12px}
.diag-item{padding:8px 12px;border-radius:6px;margin-bottom:4px;font-size:0.9rem}
.diag-item.error{background:#fef2f2;border-left:3px solid var(--af-error)}
.diag-item.warning{background:#fffbeb;border-left:3px solid var(--af-warning)}
.diag-code{font-family:monospace;font-weight:700;margin-right:8px;font-size:0.85rem}
.diag-loc{color:var(--af-text-secondary);font-family:monospace;font-size:0.8rem;margin-right:8px}
.state{padding:2px 8px;border-radius:4px;font-size:0.8rem;font-weight:600}
.state.done,.state.on{background:#d1fae5;color:#065f46}
.state.active{background:#dbeafe;color:#1e40af}
.state.suspended{background:#fef3c7;color:#92400e}
.state.failed,.state.cancelled{background:#fee2e2;color:#991b1b}
.progress-bar{height:8px;background:#f3f4f6;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.3s}
code{font-family:monospace;font-size:0.85em;background:#f3f4f6;padding:1px 4px;border-radius:3px}
.quick-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.link-card{display:block;background:var(--af-surface);border:1px solid var(--af-border);border-radius:var(--af-radius);padding:16px;text-align:center;font-weight:600;transition:box-shadow 0.15s}
.link-card:hover{box-shadow:0 2px 8px rgba(79,70,229,0.15)}
.nav-bar{background:var(--af-surface);border-bottom:1px solid var(--af-border);padding:12px 24px;display:flex;gap:20px;align-items:center}
.nav-bar a{color:var(--af-text-secondary);font-size:0.9rem;font-weight:500}
.nav-bar a.active,.nav-bar a:hover{color:var(--af-primary)}
.safety-alert{background:#fef2f2;border:2px solid var(--af-error);border-radius:var(--af-radius);padding:14px 18px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.hint{text-align:center;color:var(--af-text-secondary);padding:40px}
.input-grid{display:grid;grid-template-columns:1fr 280px;gap:16px}
.side-inputs{display:flex;flex-direction:column;gap:10px}
.version-controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.spec-editor{width:100%;font-family:monospace;font-size:0.9rem;padding:12px;border:1px solid var(--af-border);border-radius:6px;resize:vertical;margin-bottom:12px;min-height:300px}
.diff-grid{display:grid;gap:12px}
.diff-section{padding:12px;background:#f9fafb;border-radius:6px}
.diff-section h3{font-size:0.9rem;margin-bottom:8px}
.added{color:var(--af-success)}
.removed{color:var(--af-error)}
.threshold-bar{display:flex;height:32px;border-radius:6px;overflow:hidden;margin-bottom:8px}
.threshold-zone{display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600;white-space:nowrap;overflow:hidden}
.empty{text-align:center;color:var(--af-text-secondary);padding:32px!important}
.section{margin-bottom:12px}
details summary{cursor:pointer;font-weight:600;color:var(--af-text-secondary);margin-bottom:8px}
.tag{padding:2px 8px;border-radius:4px;font-size:0.8rem;background:#ede9fe;color:#5b21b6;font-family:monospace}
.recover{font-weight:600;font-size:0.85rem}
.recover.yes{color:var(--af-success)}
.recover.no{color:var(--af-error)}
.desc{color:var(--af-text-secondary);margin-bottom:20px;font-size:0.95rem}
@media(max-width:768px){.input-grid,.workspace{grid-template-columns:1fr}.threshold-bar{font-size:0.7rem}}
</style>
</head>
<body>
<div id="app">
  <div class="nav-bar">
    <router-link to="/overview" :class="{active:route==='/overview'}">概览</router-link>
    <router-link to="/automations" :class="{active:route==='/automations'}">自动化列表</router-link>
    <router-link to="/simulation" :class="{active:route==='/simulation'}">仿真回放</router-link>
    <router-link to="/confidence" :class="{active:route==='/confidence'}">置信度面板</router-link>
    <router-link to="/versions" :class="{active:route==='/versions'}">版本与Diff</router-link>
    <router-link to="/spec-editor" :class="{active:route==='/spec-editor'}">AF-Spec 工作台</router-link>
    <router-link to="/faults" :class="{active:route==='/faults'}">故障图鉴</router-link>
  </div>
  <router-view></router-view>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script>
const { createApp, ref, onMounted, computed, h } = Vue
const { createRouter, createWebHistory } = VueRouter

/* ===== Types (runtime) ===== */
const BAND_COLORS = { auto: '#10b981', shadow: '#f59e0b', ask: '#dc2626' }

/* ===== Mock Data ===== */

          {id:'q1',kind:'ask',name:'询问是否开空调',prompt:'书房 27 度了，要开空调吗？',session:'room',room:'study',timeout:'60s'},
          {id:'d1',kind:'do',name:'开书房空调',adapter:'ha',action:'climate.turn_on',params:{entity_id:'climate.study'},requires_confirm:true,canary:{duration:'15m',auto_rollback:true}},
          {id:'p1',kind:'pass',name:'静默结束'},
          {id:'p2',kind:'pass',name:'用户拒绝'},
        ],
        edges:[{from:'a1',to:'i1',kind:'then'},{from:'i1',to:'q1',kind:'then'},{from:'i1',to:'p1',kind:'no'},{from:'q1',to:'d1',kind:'yes'},{from:'q1',to:'p2',kind:'no'},{from:'q1',to:'p1',kind:'on_timeout'},{from:'q1',to:'p1',kind:'default'},{from:'q1',to:'p2',kind:'on_cancel'},{from:'d1',to:'p1',kind:'then'},{from:'d1',to:'p1',kind:'on_error'}]
      },

}

/* ===== API Layer ===== */
let useMock = true
async function apiReq(method, path, body) {
  if (useMock) return new Promise(resolve => setTimeout(() => resolve(mockApi(path, body)), 80))
  return fetch(`http://localhost:8787/api${path}`, {method, headers:{'Content-Type':'application/json'}, body:body?JSON.stringify(body):undefined}).then(r=>r.json())
}
function mockApi(path, body) {
  const p = path.split('/')[1]
  if (p==='health') return mockData.health
  if (p==='graphs') return mockData.graphs
  if (p==='graph') return mockData.irs[decodeURIComponent(path.split('/')[2])] ?? {...mockData.irs.study_day_light}
  if (p==='conf') return mockData.confidences
  if (p==='spec/compile') return {ok:true, ir:mockData.irs.study_day_light.ir, nl:'当条件满足时执行动作。', diagnostics:[{code:'L2_NEEDS_CONFIRM',level:'warning',message:'L2动作建议使用canary+人工确认',automation_id:'compiled_auto',node_id:'d1'}]}
  if (p==='spec') return {spec:'automation my_auto\nname "我的自动化"\nmode single\ntrigger:\n  on: binary_sensor.study_motion\n  to: "on"\nif:\n  expr: "entity.sensor.study_illum < 200"\ndo:\n  adapter: ha\n  action: "light.turn_on"\n  params:\n    entity_id: "light.study_main"'}
  if (p==='diff') return {render:'--- study_day_light v1\n+++ study_day_light v2\n@@ -nodes @@\n+  { id: "d1", kind: "do", name: "新增动作节点" }\n', structured:{added_automations:[],removed_automations:[],added_nodes:[{node_id:'d1',name:'新增动作节点'}],removed_nodes:[],changed_nodes:[],added_edges:[],removed_edges:[],meta_changes:[]}}
  if (p==='faults') return mockData.faults
  if (p==='build') return {ok:true, errors:body?.ir?.id==='dangerous_delete_all'?[{code:'L3_ACTION',level:'error',message:'高危动作（HTTP POST to external）',automation_id:'dangerous_delete_all',node_id:'d1'}]:[], warnings:[], nl:'编译完成。'}
  if (p==='sim') return {instances:[{instance_id:'uuid-001',state:'done',current_node:'p1',trace:[{node:'a1',at:'2026-09-14T08:00:00Z'},{node:'i1',at:'2026-09-14T08:00:01Z'},{node:'d1',at:'2026-09-14T08:00:02Z'},{node:'p1',at:'2026-09-14T08:00:03Z'}]}],audit:[{type:'action_failed',entity_id:'light.study_main',message:'设备响应正常',at:'2026-09-14T08:00:02Z'}],bus:{},final_states:{'light.study_main':'on'},nl:'仿真完成：检测到有人，光照不足，主灯已开启。'}
  return {}
}
const facade = {
  health: () => apiReq('GET','/health'),
  graphs: () => apiReq('GET','/graphs'),
  graph: (name) => apiReq('GET',`/graphs/${encodeURIComponent(name)}`),
  build: (ir) => apiReq('POST','/build',{ir}),
  sim: (ir,seed,events) => apiReq('POST','/sim',{ir,seed,events}),
  conf: (name) => apiReq('GET',`/conf/${encodeURIComponent(name)}`),
  intervene: (name,automation_id) => apiReq('POST',`/conf/${encodeURIComponent(name)}/intervene`,{automation_id}),
  diff: (name,old,new_v) => apiReq('GET',`/diff?name=${encodeURIComponent(name)}&old=${old}&new=${new_v}`),
  spec: (name) => apiReq('GET',`/spec/${encodeURIComponent(name)}`),
  specCompile: (text) => apiReq('POST','/spec/compile',{text}),
  faults: () => apiReq('GET','/faults'),
}

/* ===== Components ===== */
const DiagnosticPanel = {
  props:['diagnostics'],
  template:`
    <section class="panel" v-if="diagnostics&&diagnostics.length">
      <h2>扫描诊断</h2>
      <div v-for="d in diagnostics" :key="d.code+d.node_id+d.message" :class="['diag-item',d.level]">
        <span class="diag-code">{{d.code}}</span>
        <span class="diag-loc" v-if="d.automation_id">[{{d.automation_id}}/{{d.node_id}}]</span>

          <div class="diff-grid">

            <div v-if="diffData.structured.added_edges.length" class="diff-section"><h3 class="added">+ 新增边</h3><ul><li v-for="e in diffData.structured.added_edges" :key="e.from+e.to"><code>{{e.from}}→{{e.to}}</code> {{e.kind}}</li></ul></div>
            <div v-if="diffData.structured.removed_edges.length" class="diff-section"><h3 class="removed">− 移除边</h3><ul><li v-for="e in diffData.structured.removed_edges" :key="e.from+e.to"><code>{{e.from}}→{{e.to}}</code> {{e.kind}}</li></ul></div>
            <div v-if="diffData.structured.meta_changes.length" class="diff-section"><h3>◆ 元数据变更</h3><ul><li v-for="m in diffData.structured.meta_changes" :key="m.key"><code>{{m.key}}</code>: {{m.old_value}} → {{m.new_value}}</li></ul></div>
          </div>
        </section>
      </template>
    </div>
  `,
  data(){return{graphs:[],selectedGraph:'',selectedOld:'1',selectedNew:'2',diffData:null,diffLoading:false,error:'',versions:[1,2,3]}},

    async runDiff(){
      this.diffLoading=true;this.error='';
      try{const r=await facade.diff(this.selectedGraph,this.selectedOld,this.selectedNew);this.diffData=r}catch(e){this.error=String(e)}finally{this.diffLoading=false}
    }
  },
  mounted(){this.loadGraphs()}
}
