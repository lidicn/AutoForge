name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q

  contracts:
    name: adm-linkage-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ADM linkage contract tests
        # DCD v4.1 七问裁定 第一档①：三主通道接口契约测试进 CI，防跨仓协议漂移。
        # 已落地：DB→AF（ASK 队列，tests/contract/test_af_ask_contract.py）、
        #         AF→MA（指标回灌，tests/contract/test_af_ma_metrics_contract.py）。
        # 本步独立于全量 suite，避免被历史不稳定/需真 HA 的用例淹没，使联动契约成为可见硬闸门。
        run: pytest tests/contract -v

  gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install homesdk (质量门禁，私有包)
        # homesdk 无公共 registry，仓库内随附 wheel 于 docker/homesdk/。
        # 优先装仓库内 wheel；均不可用时回退告警，门禁步仅 skip 不阻断合并（P0-1 修复）。
        run: |
          pip install docker/homesdk/*.whl \
            || echo "homesdk 不可用，跳过门禁"
        continue-on-error: true
      - name: 门禁导入检查（P0-1）
        # 干净环境必须能成功 import af_runtime（缺 homesdk 会直接失败）。
        run: python -c "import autoforge.af_runtime"
        continue-on-error: true
      - name: Run quality gates
        run: bash gates.sh
        continue-on-error: true

  architecture:
    name: layering-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 架构反向依赖硬门（check_imports.py，grimp baseline-lock）
        # L0 内核 → L1 运行时 → L2 服务，禁反向依赖；违规即 fail（已稳定，作硬闸门）。
        run: python scripts/check_imports.py
      - name: import-linter 契约（渐进 B→A：先告警）
        # DCD 后续优化三项裁定 · 分层 import-linter：观察一版本 continue-on-error，
        # 稳定后再升失败门禁（去掉本行 continue-on-error）。
        run: lint-imports
        continue-on-error: true
