name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install homesdk (私有 wheel，仓库内随附)
        # af_executor / af_runtime 硬依赖 homesdk.consent（WO-AF-001 收口）。
        # 钉死文件名、不用通配（与 Dockerfile.api/test 同构），装不上就是真坏了，
        # 不许回退成"跳过"。
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Run tests
        run: pytest tests/ -q

  contracts:
    name: adm-linkage-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install homesdk (私有 wheel，仓库内随附)
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Run ADM linkage contract tests
        # DCD v4.1 七问裁定 第一档①：三主通道接口契约测试进 CI，防跨仓协议漂移。
        # 已落地：DB→AF（ASK 队列，tests/contract/test_af_ask_contract.py）、
        #         AF→MA（指标回灌，tests/contract/test_af_ma_metrics_contract.py）。
        # 本步独立于全量 suite，避免被历史不稳定/需真 HA 的用例淹没，使联动契约成为可见硬闸门。
        run: pytest tests/contract -v

  gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install homesdk (质量门禁，私有包)
        # homesdk 无公共 registry，仓库内随附 wheel 于 docker/homesdk/。
        # 2026-10-01 整改：原来的 `|| echo "跳过门禁"` + continue-on-error 会让门禁
        # **永远不可能红**——这正是 MA 同批自查披露的假绿同型（见 DCD 20261001 回填）。
        # 文件名钉死、不通配；装不上即整条 job 失败。
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Install package (门禁冒烟需要可导入的 autoforge)
        # 冒烟门跑的是 `import autoforge`，本仓不装就等于门没门。
        run: pip install -e .
      - name: 门禁导入检查（P0-1）
        # 干净环境必须能成功 import af_runtime（缺 homesdk 会直接失败）。
        run: python -c "import autoforge.af_runtime"
      - name: Run quality gates
        run: bash gates.sh

  architecture:
    name: layering-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 架构反向依赖硬门（check_imports.py，grimp baseline-lock）
        # L0 内核 → L1 运行时 → L2 服务，禁反向依赖；违规即 fail（已稳定，作硬闸门）。
        run: python scripts/check_imports.py
      - name: import-linter 契约（渐进 B→A：先告警）
        # DCD 后续优化三项裁定 · 分层 import-linter：观察一版本 continue-on-error，
        # 稳定后再升失败门禁（去掉本行 continue-on-error）。
        run: lint-imports
        continue-on-error: true

  ui:
    name: ui-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps（锁文件安装，不用 npm install）
        run: npm ci
        working-directory: ui
      - name: 类型硬门（vue-tsc -b --force）
        # 2026-10-02 登记质量债收口：此前 `vue-tsc -b`（无 --force）在本地有
        # tsbuildinfo 时会**增量跳过**＝假绿；--force 保证每次全量真检查。
        # 不带 continue-on-error：红就是红。
        run: npm run type-check
        working-directory: ui
      - name: 构建产物（vite build + manifest）
        run: npm run build
        working-directory: ui
