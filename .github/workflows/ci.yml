name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install homesdk (私有 wheel，仓库内随附)
        # af_executor / af_runtime 硬依赖 homesdk.consent（WO-AF-001 收口）。
        # 钉死文件名、不用通配（与 Dockerfile.api/test 同构），装不上就是真坏了，
        # 不许回退成"跳过"。
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Run tests
        run: pytest tests/ -q

  contracts:
    name: adm-linkage-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install homesdk (私有 wheel，仓库内随附)
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Run ADM linkage contract tests
        # DCD v4.1 七问裁定 第一档①：三主通道接口契约测试进 CI，防跨仓协议漂移。
        # 已落地：DB→AF（ASK 队列，tests/contract/test_af_ask_contract.py）、
        #         AF→MA（指标回灌，tests/contract/test_af_ma_metrics_contract.py）。
        # 本步独立于全量 suite，避免被历史不稳定/需真 HA 的用例淹没，使联动契约成为可见硬闸门。
        run: pytest tests/contract -v

  gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install homesdk (质量门禁，私有包)
        # homesdk 无公共 registry，仓库内随附 wheel 于 docker/homesdk/。
        # 2026-10-01 整改：原来的 `|| echo "跳过门禁"` + continue-on-error 会让门禁
        # **永远不可能红**——这正是 MA 同批自查披露的假绿同型（见 DCD 20261001 回填）。
        # 文件名钉死、不通配；装不上即整条 job 失败。
        run: pip install docker/homesdk/homesdk-0.3.1-py3-none-any.whl
      - name: Install package + dev deps (门禁冒烟要能 import autoforge，判据 B 要能跑 pytest)
        # 冒烟门跑的是 `import autoforge`，本仓不装就等于门没门。
        # dev 不是可选项：有界缓存门的判据 B 起 `python -m pytest --collect-only` 核对注册表里
        # 那条测试 id 真被收集。run 68 撞到的就是这里只装裸包——`No module named pytest` ⇒ rc=1
        # ⇒ 本门按设计退 2（读不成不许报干净），整条作业红。装声明过的 extra，不在此手搓包名。
        run: pip install -e ".[dev]"
      - name: 门禁导入检查（P0-1）
        # 干净环境必须能成功 import af_runtime（缺 homesdk 会直接失败）。
        run: python -c "import autoforge.af_runtime"
      - name: Run quality gates
        run: bash gates.sh

  architecture:
    name: layering-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 架构反向依赖硬门（check_imports.py，grimp baseline-lock）
        # L0 内核 → L1 运行时 → L2 服务，禁反向依赖；违规即 fail（已稳定，作硬闸门）。
        run: python scripts/check_imports.py
      - name: import-linter 契约（裁定 20260930 子决策三：B→A 的第二档，已升为失败门禁）
        # DCD 后续优化三项裁定 · 分层 import-linter：执行约束写的是"观察一个版本（或 2 周），
        # 确认无合法误伤 → 升为 CI 失败"。观察窗内的读数：本机 `lint-imports` =
        # `Contracts: 1 kept, 0 broken.`（RC=0），runner 上同一契约连续多轮 `KEPT`
        # （run 34 / job 111082312792 原话 `Service boundary never imported by kernel KEPT`），
        # 误伤 0 条 ⇒ 按裁定去 `continue-on-error`。能变红由本地实测：给 `af_time.py`
        # 加一行 `from autoforge import af_service` ⇒ RC=1 + `BROKEN`，并连带报出
        # `af_ir -> af_bus -> af_time -> af_service` 这条**间接**链（check_imports.py 锁的是直接反向依赖）。
        run: lint-imports

  ui:
    name: ui-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps（锁文件安装，交付面走官方源）
        # DCD 裁定 20261002「AF CI 锁文件源与 MA 载荷键名」§一：(b) 只把 CI 侧改指官方源，
        # 不动 `ui/package-lock.json` 一个字节，本机开发照旧走镜像。
        # 必须两条一起给：只写 `--registry=` 是**空操作**——锁文件 137/137 条 `resolved` 指
        # registry.npmmirror.com，而 npm 的 `replace-registry-host` 默认值是 `npmjs`（只改写
        # registry.npmjs.org 主机，不动第三方主机）。本机实测（同一份锁文件、空缓存目录、`--loglevel=http`
        # 的 fetch 行按主机计数）：
        #   只 `--registry=https://registry.npmjs.org`（默认 replace）→ RC=0，但 fetch 行是
        #     registry.npmmirror.com 87 + cdn.npmmirror.com 87，npmjs 只有 argv 回显 1 行＝装的仍是镜像；
        #   `--registry=https://registry.invalid.test --replace-registry-host=always` → RC=1 ENOTFOUND，
        #     日志里 193 处主机引用全打 invalid.test、npmmirror 0 处＝改写确实发生；
        #   本 job 这条（官方源 + always）→ 空缓存装机 RC=0，该次日志 263 处主机引用全打
        #     registry.npmjs.org、npmmirror 0 处；同一份 node_modules 上 `vue-tsc -b --force` 与
        #     `vite build` 均 RC=0（本机 Node 24 / npm 11.9.0 预跑，runner 上以本 job 的自证读数为准）。
        # 交付面逐字节对账：137/137 条官方 tarball 的 sha512 与锁文件 `integrity` 全 MATCH，
        # 所以这条改写不会 EINTEGRITY；同一份 node_modules 上 `vue-tsc -b --force` 与 `vite build` 都 RC=0。
        # 交付面**必须自证**：npm ci 绿不能证明它没吃镜像（镜像照样能装成功），所以把
        # `--loglevel=http` 的 fetch 行留在日志里并当场数主机（本机实测该 loglevel 会把 URL 打到 stdout）。
        # 主机匹配写 `npmmirror\.com` 而不是 `registry.npmmirror.com`：实测镜像还会把 tarball 重定向到
        # `cdn.npmmirror.com`（同一份日志里两个主机各 87 行），只数第一个会漏。
        # flag 形式在 npm 11.9.0 上实测；`replace-registry-host` 自 npm 9.6.3 起存在，runner 的 npm 10.x 适用。
        run: |
          set -o pipefail
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always \
            --no-audit --loglevel=http 2>&1 | tee /tmp/npm-ci.log
          mirror_hits=$(grep -c 'npmmirror\.com' /tmp/npm-ci.log || true)
          official_hits=$(grep -c 'registry\.npmjs\.org' /tmp/npm-ci.log || true)
          echo "fetch 主机读数：npmmirror=${mirror_hits} npmjs=${official_hits}"
          if [ "$mirror_hits" -ne 0 ] || [ "$official_hits" -eq 0 ]; then
            echo "::error::CI 没有从官方源拉包（交付面仍在吃第三方镜像）"
            exit 1
          fi
        working-directory: ui
      - name: 类型硬门（vue-tsc -b --force）
        # 2026-10-02 登记质量债收口：此前 `vue-tsc -b`（无 --force）在本地有
        # tsbuildinfo 时会**增量跳过**＝假绿；--force 保证每次全量真检查。
        # 不带 continue-on-error：红就是红。
        run: npm run type-check
        working-directory: ui
      - name: 构建产物（vite build + manifest）
        run: npm run build
        working-directory: ui
