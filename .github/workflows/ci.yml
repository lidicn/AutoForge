name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q

  gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install homesdk (质量门禁，私有包)
        # homesdk 无公共 registry；有 remote 的内部部署请改用内部 wheel 路径。
        # 本地路径 / 容器 wheel 都不可用时回退告警，门禁步仅skip不阻断合并。
        run: |
          pip install -e "E:/NAS/homesdk" \
            || pip install /vol1/1000/docker/libs/homesdk/dist/homesdk-*.whl \
            || echo "homesdk 不可用，跳过门禁"
        continue-on-error: true
      - name: Run quality gates
        run: bash gates.sh
        continue-on-error: true
