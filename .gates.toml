# AutoForge 质量门禁口径（仓库根，单源权威）
# 由 PM/整合 于 2026-09-19 依据 `doc/审计与横评-202609/02-审计-AutoForge.md` 起草。
#
# WO-AF-014 门禁基线唯一定义：本文件是**唯一权威源**。
# 外部 `E:/NAS/AgentOps/gates/AutoForge.gates.toml` 为历史分叉副本，已弃用——
# 任何门禁口径调整只在此处进行，外部副本不再同步（避免两容器基线分叉）。
# `gates.sh` 运行时只读本文件（`$REPO/.gates.toml`），不触及外部副本。

source_roots = ["src"]

# 冒烟：只证明顶层 import 打得开，不证明服务能起。部署验收仍要 `docker compose ps` + HTTP。
smoke_targets = ["autoforge"]

# ── 关键模块：这里的 `except Exception: pass` 是硬错误，不许进基线 ──────────
# 选取依据：本次审计里「闸门被绕过 / 回滚谎报 / 鉴权失效」全部发生在这批文件。
critical_globs = [
    "src/autoforge/af_executor.py",    # 审批门（P0-1 classify_answer / P1-24 ask 路由）
    "src/autoforge/af_pending.py",     # 待批队列
    "src/autoforge/af_canary.py",      # 金丝雀回滚
    "src/autoforge/af_auth.py",        # 鉴权
    "src/autoforge/af_scanner.py",     # 静态扫描分级
    "src/autoforge/af_affordance.py",  # 风险域表（与 af_adapters/base.py 的表矛盾即 P0）
    "src/autoforge/af_adapters/*",     # 真机写入
    "src/autoforge/af_ir/*",           # IR 与边优先级
    # 第六轮审计 REG-3：这两份是"缺陷实际发生地"却在看守之外（去抖那条 NameError 就在 scheduler）。
    "src/autoforge/af_scheduler.py",   # 触发/mode/配额/去抖
    "src/autoforge/af_service.py",     # 会话与仿真编排（`_SESSIONS` 家族）
    "src/autoforge/af_mqtt_bridge.py", # 跨仓说话的一张嘴：吞异常就等于对端静默失联
]

# ── 写入路径：这里的字面量 `ok=True` 是硬错误 ─────────────────────────────
write_path_globs = [
    "src/autoforge/af_adapters/*",
    "src/autoforge/af_live.py",
    "src/autoforge/af_executor.py",
    "src/autoforge/af_canary.py",
    "src/autoforge/af_persist.py",
    "src/autoforge/af_instance.py",
]

# G3 加严项：WO-AF-001 合入、词表物理删除之后，**必须改成 true** 再不许回头。
forbid_local_consent_tables = true

extra_skip_globs = [
    "src/autoforge.egg-info/*",
    "examples/*",   # 示例 IR 的配套 py 不参与门禁
]
