# AutoForge 只读服务层（FastAPI）—— NAS 部署用。
#
# 在仓库根目录执行：
#   docker compose -f docker/docker-compose.api.yml up -d --build
#
# 仅暴露 8787；归档目录挂到 NAS 持久路径（重启不丢版本/置信度）。
# ⚠️ Round 1 只读：不连真实 HA、不写设备。

services:
  autoforge-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: autoforge-api:latest
    container_name: autoforge-api
    ports:
      - "8787:8787"
    # 前端静态托管：把构建产物 dist 以卷挂入 /ui，由 serve --ui-dir 启用同源 SPA fallback（/api 无需跨域）
    # 前端已并入主仓库（原独立仓库 autoforge-ui → 现 e:/NAS/AutoForge/ui），dist 由该目录构建产出。
    # 用户视角 UI（ui-user-mimo，DCD 20261005 §一 交付面认定 B）挂 /mimo：其 vite base 必须与
    # `af_api.UI_USER_PREFIX` 同值，否则 dist 里的资源绝对路径 /mimo/assets/* 与挂载前缀对不上，
    # 页面会 200 但白屏。这条同源由 tests/unit/test_ui_user_mount.py 当场核对。
    command: ["forge", "serve", "--host", "0.0.0.0", "--port", "8787", "--store-root", "/data", "--examples", "/app/examples/ir", "--ui-dir", "/ui", "--ui-user-dir", "/mimo"]
    volumes:
      - /vol1/1000/docker/autoforge-store:/data
      - /vol1/1000/docker/autoforge/ui/dist:/ui
      - /vol1/1000/docker/autoforge/ui-user-mimo/dist:/mimo
      # 基线收口（v2.0.1/0.1-d）：镜像已烘入 src（Dockerfile.api COPY src），运行时不再挂宿主源码，
      # 避免「镜像基线」与「实际运行」分叉。后端变更须经 `docker compose build` 重烘镜像。
      # 仅本地热改后端免重建时，可临时取消下行注释（开发期，勿入生产）：
      # - /vol1/1000/docker/autoforge/src:/app/src
    # ---- 敏感 token：secret 管理（v2.0.1 / PR 0.1-b）----
    # 不再依赖明文 env_file: ../.env（.env 仍被 .gitignore 忽略，绝不进版本库）。
    # 代码读取顺序：credentials.json > secret 文件（AUTOFORGE_SECRET_DIR，默认 /run/secrets）> 环境变量。
    # 非敏感开关用 environment 从宿主机 shell env 注入；敏感 token 二选一：
    #   (A) docker secrets：取消下方 `secrets:` 引用 + 文件末 `secrets:` 段注释，并在宿主机
    #       创建 secret 文件（install -m 600 ... /vol1/1000/docker/autoforge/secrets/AUTOFORGE_HA_TOKEN）；
    #   (B) shell env：取消 `- AUTOFORGE_HA_TOKEN=${AUTOFORGE_HA_TOKEN:-}` 注释，宿主机
    #       export AUTOFORGE_HA_TOKEN=... 后 docker compose up。
    # secrets:
    #   - autoforge_ha_token
    #   - autoforge_api_tokens
    #   - autoforge_revoked_tokens
    environment:
      - AUTOFORGE_LIVE_ENABLED=${AUTOFORGE_LIVE_ENABLED:-0}
      - AUTOFORGE_HA_URL=${AUTOFORGE_HA_URL:-}
      - AUTOFORGE_SESSION_TTL_S=${AUTOFORGE_SESSION_TTL_S:-3600}
      # DCD 20260929 P3：ask 通道端到端送达生效前提——AF 必须启用，且与豆包管家共享同一 key（HMAC 对称）。
      # 值由宿主机 env / .env 注入；deploy 前确保 AUTOFORGE_INBOX_KEY 已设，否则读侧（af_live.py:410）拒收全部 inbox 答案。
      # ⚠️ compose 自动加载的 .env 在「compose 同目录」（即本文件所在 docker/.env），不是仓库根；放错位置会取到空值。也可用 `docker compose --env-file .env` 显式指定。
      - AUTOFORGE_INBOX_KEY=${AUTOFORGE_INBOX_KEY:-}
      # ---- ADM 联动桥（§5.3 第 10 件；裁定 20261004 18:35 §二：补齐引用、值一律留空）----
      # 缺省关：只有显式给 1 才起桥，键名真源是 `af_mqtt_bridge.py` 的 `ENV_ENABLED`
      # （`env_enabled()` 把空串/0/false/no/off 一律读成"关"）。
      # 下面五个 MQTT_* 的键名**不在这份文件里发明**：唯一真源是烘进镜像的那枚 wheel
      # （`Dockerfile.api` 按文件名钉死的 `docker/homesdk/homesdk-0.3.2-py3-none-any.whl`），
      # `homesdk/mqtt.py` 的 `broker_settings()` 读 MQTT_HOST / MQTT_PORT / MQTT_KEEPALIVE，
      # `resolve_credentials()` 读 MQTT_USER / MQTT_PASSWORD。它同时认别名
      # （MQTT_USERNAME / MQTT_PASS / MQTT_PASSWD 与按 peer 作用域的 MQTT_USER_〈scope〉），
      # 本仓只写规范那两条，免得同一台机器长出第二种习惯。这条同源由
      # `tests/unit/test_mqtt_compose_env.py` 当场核对，不靠人记得。
      # 留空是真 no-op：`homesdk/config.py` 的 `_lookup` 明写"空串与未设置同视" ⇒ 空的 MQTT_PORT
      # 仍落 wheel 里的 DEFAULT_PORT（1883），而空的 MQTT_HOST 抛 MissingEnv 而不是匿名连出去。
      # ⚠️ 打开开关不是改这里就完事：起桥排在 `uvicorn.run` 之前且不吞异常（§二之二十六），
      # 值没配好就是整个 AF 起不来（含只读面，`restart: unless-stopped` 会变反复重启）。
      # 真打开走**非停机窗**的配置推送，推送前先 `compose exec` 预检 `paho_available()` 与
      # `broker_settings()` 两条都过。口令是敏感项，与 `AUTOFORGE_HA_TOKEN` 同档：值只从宿主机
      # shell env 或 secrets 注入，**不要把真值写进这份入库的文件**。
      - AUTOFORGE_MQTT=${AUTOFORGE_MQTT:-0}
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PORT=${MQTT_PORT:-}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE:-}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # - AUTOFORGE_HA_TOKEN=${AUTOFORGE_HA_TOKEN:-}
      # - AUTOFORGE_API_TOKENS=${AUTOFORGE_API_TOKENS:-}
    restart: unless-stopped

# 顶层 secret 定义（docker secrets 风格；默认全注释——启用前先在宿主机创建对应文件）：
#   install -m 600 /path/to/ha_token /vol1/1000/docker/autoforge/secrets/AUTOFORGE_HA_TOKEN
# secrets:
#   autoforge_ha_token:
#     file: /vol1/1000/docker/autoforge/secrets/AUTOFORGE_HA_TOKEN
#   autoforge_api_tokens:
#     file: /vol1/1000/docker/autoforge/secrets/AUTOFORGE_API_TOKENS
#   autoforge_revoked_tokens:
#     file: /vol1/1000/docker/autoforge/secrets/AUTOFORGE_REVOKED_TOKENS
