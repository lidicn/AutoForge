# AutoForge 真机常驻监听（sync 面）—— 书房"挂灯→吊灯跟随"那条自动化的正式编排。
#
# AF-714（2026-10-31）：NAS 上此前用临时 `docker run` 起的孤儿容器（无编排定义、
# 凭据明文进命令行、restart 循环 329 次），本文件是它**正式的仓内替身**——
# ⛔ 不照抄临时容器的名字/写法，凭据一律经 env 注入（值永不进仓）。
#
# 在仓库根目录执行（先把三枚 env 在宿主机 shell 配好）：
#   docker compose -f docker/docker-compose.sync.yml up -d --build
#
# 前置（缺一不可，缺了就是"每秒起一次、每次 exit 2"的崩溃循环重演）：
#   export AUTOFORGE_HA_URL=http://<ha-host>:8123
#   export HA_LONG_LIVED_TOKEN=<B类·AF→HA 出站令牌>      # ⚠️ AF-720：watch 真源＝store
#       `credentials.json`（cfg.get_ha_token() 优先于 env，af_cli.py watch 取值序末位才是
#       env 回退）——本机 docker/.env 那枚是失效旧令牌（401），store 真值在位时 env 可不注
#   export AUTOFORGE_AUTH_CODE=<部署授权码>              # ⚠️ AF-722 后**通常不需要**：第五面
#       免码已成立（watch 的 IR 在 store 里有已 approve 的归档，按 automation id 逐条查、
#       fail-closed）⇒ 不注码容器照常开机自起；仅当 IR **未归档**时才走 env 口注码
#       （**长期码**；短期码过期即失效，编排面禁用）。真值绝不进本文件。
#   export AUTOFORGE_SYNC_LIVE_ALLOW=switch.xxx,light.yyy # 真机可写白名单（逗号分隔）
#
# 授权码说明（AF-722 后更新，2026-11-02 真机实测）：**免码是常态**——watch 启动时按
# automation id 逐条查 store 里已 approve 的归档，查得到 ⇒ 免码（实测空码 env 重建容器
# restart=0、真机双向跟随四腿 ≤2s 全绿）；查不到 ⇒ 才需要 env 口注码，且必须**长期码**
# （短期码 5–30 分钟过期，容器重启后即失效，会让 restart 循环回来）。
# 「开机自起要不要码」的裁定原文见「常驻监听五个启动面」件：第五面免码成立后，
# env 口降级为**冗余回退口**（仅在 IR 未归档时需要）。

services:
  autoforge-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: autoforge-api:latest   # 与 api 服务同一镜像：CLI 就在包里，不需要第二份构建
    container_name: autoforge-sync
    init: true
    command: >
      python -m autoforge.af_cli watch /app/examples/ir/case_lamp_sync.json
      --confirm
      --persist-dir /data
      --ha-url ${AUTOFORGE_HA_URL}
      --live-allow ${AUTOFORGE_SYNC_LIVE_ALLOW}
    volumes:
      # 码账本在 store 根的 .auth/ 下，必须与 autoforge-api 挂同一个 store 卷，
      # 否则 watch 读不到 WebUI 签发的授权码（auth_codes.json 两头各一份）。
      - /vol1/1000/docker/autoforge-store:/data
    environment:
      # ⛔ 三枚敏感值全部来自宿主机 env（docker inspect 只见键名与占位）：
      #   HA_LONG_LIVED_TOKEN / AUTOFORGE_AUTH_CODE —— 真值绝不写进本文件。
      # HA 令牌（AF-720 更正，2026-11-01 真机实测）：**令牌真源＝store `credentials.json`**
      # ——`af_cli watch` 的取值序是「命令行参数 → store 真值（cfg.get_ha_token()）→ env
      # HA_LONG_LIVED_TOKEN → env AUTOFORGE_HA_TOKEN」，`cfg.get_ha_token()` 读 store 真值、
      # **优先于 env**；env 那枚仅是取值序末位回退，且本机 docker/.env 里那枚是失效旧令牌
      # （对 HA /api/ 返 401）⇒ 只注 env 不配 store 会 401。env 口子保留（store 无令牌时的回退）。
      # ⛔ 本段刻意不写出命令行参数名：编排面判据要求该名字面不得出现在本文件（明文凭据面）；
      #   参数名与完整取值序见台账 AF-720 行与 QA 侧 plans/AF_sync编排口径更正_20261101.md。
      - HA_LONG_LIVED_TOKEN=${HA_LONG_LIVED_TOKEN:-}
      # 授权码（AF-722 后降级为**冗余回退口**）：键名 AUTOFORGE_AUTH_CODE，AF-714 新增、
      # 代码读点 af_cli._auth_code_of——第五面免码成立（watch 的 IR 在 store 有已 approve
      # 归档）⇒ 常态**不注码**；仅 IR 未归档时才注（长期码，短期码过期即失效）。
      - AUTOFORGE_AUTH_CODE=${AUTOFORGE_AUTH_CODE:-}
      - AUTOFORGE_CONF_GRADING=1   # 与 api.yml 同源：conf 分级引擎 NAS 面正式启用
    restart: unless-stopped
    stop_grace_period: 15s   # watch 的 SIGTERM 收尾路径需要宽限（审计 BUG-06 的修复面）
