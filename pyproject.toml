[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.1.0"
description = "AutoForge — Agent 为中心的智能家居自动化平台（G1 最小可运行闭环）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "typer>=0.12",
]

[project.optional-dependencies]
# 仿真（vhass）依赖：基于 pytest-homeassistant 二次开发，较重，单独装
sim = [
    "pytest-homeassistant-custom-component",
]
# 只读 HTTP 服务层（forge serve / docker/Dockerfile.api）
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# v1.6.0 P0：HA websocket 注册表（entity/device/area/config_entry 四注册表）
# 只 `device_id` / `platform` / `integration` / 精确 area 需要它；未安装时
# 目录**优雅降级**（这些字段为空、解析照常工作），不影响内核零依赖承诺。
ha = [
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
    "grimp>=2.1",
    "import-linter>=1.10",
    "paho-mqtt>=1.6,<2.1",
]
# ADM 联动第 1/2 步（af_mqtt_bridge）的运行时依赖。homesdk 把 paho 放在它自家的
# `[mqtt]` extra 里（"装它是对调用方的要求"），而镜像装的是裸 wheel ⇒ paho 不在盘上时
# `AUTOFORGE_MQTT=1` 会让 serve 直接抛 `MqttUnavailable`：联动环在生产面起不来，
# 而开发机因为手动装过 paho 一切正常。
# `dev` 里也列它，是为了消掉"同一条用例两种机器两种脸色"这个形状本身——本批就踩了一次：
# 一条断言在装了 paho 的机器上绿、在没装的机器上红。三面一致由
# scripts/check_mqtt_runtime_dep.py 钉（声明处 / 交付面 / CI 面；只在本机装过不算修）。
mqtt = [
    # DCD 裁定 20261004 §二 Q2=B：官方 PyPI + 上界钉死。paho 2.x 改了回调签名（`on_message`
    # 之外的 API 面有 breaking change），无上界时镜像某次重建可能拿到不兼容的大版本。
    "paho-mqtt>=1.6,<2.1",
]
# 同意/否决分类（G4 canary auto-rollback 的伦理闸门）依赖 homesdk。
# 它是私有 wheel，未上 PyPI；仓库内随附于 docker/homesdk/，CI 与部署时通过
#   pip install docker/homesdk/*.whl
# 安装。将其列为可选依赖仅用于声明，不进核心依赖（保持内核零依赖承诺）。
homesdk = [
    "homesdk>=0.3.1",
]

[project.scripts]
forge = "autoforge.af_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 关键：默认**不自动加载** pytest-homeassistant 插件。
# 它的 plugins.py → patch_time.py → homeassistant.runner 会 `import fcntl`（POSIX 专有），
# 在 Windows 上插件加载阶段就崩，会导致整轮 pytest 无法运行。
# 需要真 vhass 时（Linux/WSL/Docker）显式加：
#   pytest tests -q -p pytest_homeassistant_custom_component.plugins
addopts = "-p no:homeassistant"
markers = [
    "vhass: 仅在真 vhass（pytest-homeassistant）可用时运行，装不上或非 POSIX 则 skip",
    """integration: 需要真实 Home Assistant（实时 websocket / REST）的集成测试；
    离线环境（AUTOFORGE_LIVE_HA 未置 1）自动 skip，仅在带真 HA 的环境运行""",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.importlinter]
# import-linter pyproject.toml 配置（lint-imports CLI）
# 注：import-linter 2.15 的 forbidden/layers 契约在本仓库容易误报合法耦合
# （如仿真胶水层 harness 依赖 Runtime、af_bus 审计回调等）。
# 真正的架构门禁使用 scripts/check_imports.py（grimp API 直接锁零反向依赖 baseline）。
# pyproject.toml 保留此配置是为了让 lint-imports CLI 至少能跑通。
# 观察窗读数：本机 `Contracts: 1 kept, 0 broken`，runner 连续多轮 `KEPT`，误伤 0 条
# ⇒ 裁定 20260930 子决策三的第二档已落（`.github/workflows/ci.yml` 的 `lint-imports` 去
# continue-on-error，升为失败门禁）。契约刻意只做 L0→L2 这一条窄面：更宽的
# forbidden/layers 组合在本仓库会误报合法耦合，全量反向依赖由 check_imports.py 锁。
root_package = "autoforge"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Service boundary never imported by kernel"
type = "forbidden"
source_modules = [
  "autoforge.af_ir", "autoforge.af_flock", "autoforge.af_fault",
  "autoforge.af_time", "autoforge.af_adapters", "autoforge.af_auth",
]
forbidden_modules = [
  "autoforge.af_service", "autoforge.af_api",
]
